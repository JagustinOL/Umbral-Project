services:
  # ==========================================
  # --- 1. INFRAESTRUCTURA Y DATOS ---
  # ==========================================
  db:
    image: postgres:17-alpine
    container_name: umbral-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: umbral_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d umbral_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: umbral-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@umbral.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  mq:
    image: rabbitmq:3-management-alpine
    container_name: umbral-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s

  # ==========================================
  # --- 2. SEGURIDAD (Keycloak) ---
  # ==========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    container_name: umbral-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  sonarqube:
    profiles: [tools]
    image: sonarqube:10.4-community
    container_name: umbral-sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

  # ==========================================
  # --- 3. MICROSERVICIOS BACKEND (.NET 10) ---
  # ==========================================
  mission-management-service:
    build:
      context: ./MissionManagement
      dockerfile: Dockerfile
    container_name: umbral-mission-management-service
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
    ports:
      - "5260:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MissionManagement: Host=db;Port=5432;Database=umbral_db;Username=postgres;Password=postgres
      RabbitMQ__Host: mq

  session-management-service:
    build:
      context: ./SessionManagement
      dockerfile: Dockerfile
    container_name: umbral-session-management-service
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
    ports:
      - "5278:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=umbral_db;Username=postgres;Password=postgres
      RabbitMQ__Host: mq

  scoring-audit-service:
    build:
      context: ./ScoringAudit
      dockerfile: Dockerfile
    container_name: umbral-scoring-audit-service
    depends_on:
      db:
        condition: service_healthy
      mq:
        condition: service_healthy
    ports:
      - "5290:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=umbral_db;Username=postgres;Password=postgres
      RabbitMQ__Host: mq

  # ==========================================
  # --- 4. FRONTEND (Next.js) ---
  # Perfil opcional: la carpeta umbral-web aún no existe en el repo.
  # Levantar con: docker compose --profile frontend up
  # ==========================================
  umbral-web:
    profiles: [frontend]
    image: node:20-alpine
    container_name: umbral-web
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./umbral-web:/app
      - umbral-web-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_MISSION_API_URL: http://localhost:5260
      NEXT_PUBLIC_SESSION_API_URL: http://localhost:5278
      NEXT_PUBLIC_SCORING_API_URL: http://localhost:5290
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8081
    depends_on:
      - mission-management-service
      - session-management-service
      - scoring-audit-service

volumes:
  db-data:
    driver: local
  umbral-web-node-modules:
    driver: local
